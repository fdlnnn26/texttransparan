<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>XAUUSD Gold Overlay</title>
<style>
  @font-face {
    font-family: 'Anton';
    src: local('Anton');
  }
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  /* portrait safe-zone container for OBS browser source, e.g. 1080x1920 */
  .portrait {
    position: relative;
    width: 100%;
    max-width: 620px;
    aspect-ratio: 9 / 16;
    background: transparent;
  }

  /* placement: lower area so it doesn't cover a chart placed above */
  .badge-zone {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    width: 92%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* thin gold candlestick ticker line, purely decorative motif */
  .ticker {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 26px;
    opacity: 0.85;
  }
  .ticker i {
    display: block;
    width: 4px;
    background: linear-gradient(180deg, #ffe9a8, #d4af37 55%, #8a6a17);
    border-radius: 2px;
    animation: wick 1.6s ease-in-out infinite;
  }
  .ticker i:nth-child(1){height:10px; animation-delay:0s}
  .ticker i:nth-child(2){height:22px; animation-delay:.15s}
  .ticker i:nth-child(3){height:14px; animation-delay:.3s}
  .ticker i:nth-child(4){height:26px; animation-delay:.45s}
  .ticker i:nth-child(5){height:9px; animation-delay:.6s}
  .ticker i:nth-child(6){height:19px; animation-delay:.75s}
  .ticker i:nth-child(7){height:12px; animation-delay:.9s}
  @keyframes wick {
    0%, 100% { transform: scaleY(1); opacity:.7 }
    50% { transform: scaleY(1.25); opacity:1 }
  }

  /* the main rotating message card */
  .cardWrap {
    position: relative;
    width: 100%;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(14px) scale(.94);
    pointer-events: none;
  }
  .slide.active {
    animation: slideIn 0.7s cubic-bezier(.2,.9,.25,1) forwards, slideHold 3s linear 0.7s forwards;
  }
  .slide.leaving {
    animation: slideOut 0.5s ease-in forwards;
  }
  @keyframes slideIn {
    0% { opacity: 0; transform: translateY(14px) scale(.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes slideHold { to { opacity: 1; } }
  @keyframes slideOut {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-14px) scale(.96); }
  }

  /* --- Slide 1: Not Financial Advice, hand drawn circle like reference --- */
  .nfaBox { position: relative; display: flex; flex-direction: column; align-items: center; }
  .nfaText {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 54px;
    color: #ff3b3b;
    line-height: 0.95;
    text-align: center;
    text-shadow: 0 0 14px rgba(255,59,59,0.55);
    transform: rotate(-3deg);
  }
  .nfaCircle {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 170px;
    overflow: visible;
  }
  .nfaCircle path {
    fill: none;
    stroke: #21e6a8;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    filter: drop-shadow(0 0 6px rgba(33,230,168,0.7));
  }
  .slide.active .nfaCircle path {
    animation: draw 0.9s 0.25s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* --- Slide 2: mayoragoldfx.com --- */
  .siteBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .siteEyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 13px;
    color: #ffe9a8;
    text-transform: uppercase;
    opacity: .85;
  }
  .siteText {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: 40px;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #fff6d8, #d4af37 55%, #a5791b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(212,175,55,0.6));
  }

  /* --- Slide 3: Join komunitas gratis --- */
  .joinBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .joinText {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: 42px;
    color: #ffd76a;
    text-align: center;
    line-height: 1.05;
    text-shadow: 0 0 16px rgba(255,215,106,0.55);
  }
  .joinSub {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 2px;
    color: #21e6a8;
    text-transform: uppercase;
    padding: 6px 18px;
    border: 1.5px solid #21e6a8;
    border-radius: 999px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0px rgba(33,230,168,0.5); }
    50% { box-shadow: 0 0 18px rgba(33,230,168,0.6); }
  }

</style>
</head>
<body>

<div class="stage">
  <div class="portrait">
    <div class="badge-zone">

      <div class="ticker">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="cardWrap" id="cardWrap">

        <div class="slide" data-slide="0">
          <div class="nfaBox">
            <svg class="nfaCircle" viewBox="0 0 340 170">
              <path d="M 60 90 C 40 40, 120 15, 190 20 C 270 25, 320 55, 300 95 C 280 140, 190 155, 120 145 C 60 137, 45 110, 60 90 Z"/>
            </svg>
            <div class="nfaText">Not Financial<br>Advice</div>
          </div>
        </div>

        <div class="slide" data-slide="1">
          <div class="siteBox">
            <div class="siteEyebrow">Edukasi Trading Emas</div>
            <div class="siteText">mayoragoldfx.com</div>
          </div>
        </div>

        <div class="slide" data-slide="2">
          <div class="joinBox">
            <div class="joinText">Join Komunitas<br>Gratis</div>
            <div class="joinSub">100% Free</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;
  const HOLD = 3700;

  function showSlide(i) {
    slides.forEach((s, idx) => {
      s.classList.remove('active', 'leaving');
      if (idx === i) {
        void s.offsetWidth;
        s.classList.add('active');
      }
    });
  }

  function next() {
    const prev = current;
    current = (current + 1) % slides.length;
    slides[prev].classList.remove('active');
    slides[prev].classList.add('leaving');
    setTimeout(() => showSlide(current), 480);
  }

  showSlide(current);
  setInterval(next, HOLD);
</script>

</body>
</html>
